services:
  # Node.js + Express Backend Web Service
  - type: web
    name: studymate-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMMA_PROVIDER
        value: huggingface
      - key: GEMMA_MODEL_ID
        value: google/gemma-4-it
      - key: GEMMA_API_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: CONFIDENCE_THRESHOLD
        value: "0.28"

  # React Vite Frontend Static Site (JavaScript)
  - type: web
    name: studymate-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://studymate-ai-backend-6sna.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://studymate-ai-backend-6sna.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
